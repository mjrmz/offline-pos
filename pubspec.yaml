name: modern_offline_pos
description: Offline-first, cross-platform POS for Philippine SMBs.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.16.0
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  cryptography: ^2.7.0
  android_id: ^0.4.0
  uuid: ^4.4.0
  bcrypt: ^1.2.0
  mobile_scanner: ^7.4.2
  shared_preferences: ^2.5.5
  thermal_printer_flutter: 2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  build_runner: ^2.4.9
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
